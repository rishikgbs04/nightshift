[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "A job-search agent that finds roles overnight, tailors your resume/CV to each one without fabricating anything, and queues them for one-click approval."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rishik Gannavarapu" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "playwright>=1.44",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nightshift = "nightshift.cli:app"

[tool.setuptools.packages.find]
include = ["nightshift*"]

[tool.setuptools.package-data]
nightshift = ["templates/*", "web/templates/*", "web/static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx`"]
