# nightshift configuration. Paths are relative to this file.
profile_path: profile.yaml
answers_path: answers.yaml

llm:
  # anthropic | openai (any OpenAI-compatible API, e.g. a local gateway) | offline
  provider: anthropic
  model: claude-haiku-5-5            # about $0.006 per tailored job
  api_key_env: ANTHROPIC_API_KEY     # name of the env var that holds the key
  monthly_budget_usd: 9              # hard cap; AI pauses until the 1st when reached
  price_input_per_mtok: 0.10         # Haiku 5.5 prices, used to count spend
  price_output_per_mtok: 0.50
  # base_url: http://localhost:8000/v1   # for provider: openai pointed at a gateway/local model

search:
  title_include: [software engineer, software developer, swe, backend, back-end, full stack, full-stack,
                  machine learning, ml engineer, ai engineer, applied ai, data engineer, platform engineer,
                  new grad, graduate, intern, internship]
  title_exclude: [senior, sr, staff, principal, lead, manager, director, head of, vp, distinguished, architect]
  # Empty list = anywhere. Matching is substring-on-words, so "New York" matches "New York, NY".
  locations: [New York, NYC, Remote, United States, USA, US, Canada, Toronto, Vancouver, London,
              United Kingdom, UK, Dublin, Ireland, Sydney, Melbourne, Australia, Auckland, New Zealand]
  max_age_days: 30
  # If you'll need visa sponsorship, set this to true. Postings that say they
  # won't sponsor are then flagged (sponsorship_policy: flag) or skipped (skip).
  needs_sponsorship: false
  sponsorship_policy: flag

# Companies to watch, by their job-board slug (the part of the careers URL).
#   boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
# Run `nightshift boards` to check them; fix or delete any that 404.
companies:
  # Also watch the ~300 tech companies bundled with nightshift. After turning
  # this on, run `nightshift boards --prune` once to skip the dead slugs.
  include_defaults: true
  exclude: []          # slugs you never want, e.g. [somecompany]
  greenhouse: [anthropic, stripe, databricks, figma, discord, airbnb, robinhood, cloudflare, dropbox,
               pinterest, reddit, lyft, gitlab, mongodb, datadog, duolingo, asana, twitch]
  lever: [palantir, spotify, plaid]
  ashby: [openai, notion, ramp, linear, replit]

tailor:
  resume_pages: 1
  cv_pages: 2          # jobs in cv_regions get a 2-page A4 CV
  write_summary: false
  cover_letter: true

pipeline:
  max_llm_scoring_per_run: 80   # best keyword matches get scored by the model
  max_tailor_per_run: 25        # how many tailored applications per night
  min_score: 6                  # 1-10; below this, a job goes to "Low score"
  max_per_company_per_run: 3    # don't flood one company
  # Jobs scoring at least this skip your review and go straight to "approved".
  # Leave empty (null) to approve everything yourself. Start at 8 or higher.
  auto_approve_min_score: null
  auto_approve_clean_only: true # never auto-approve flagged jobs (e.g. "won't sponsor")

submit:
  enabled: false     # true = on each run, fill forms for approved jobs
  live: false        # true = also click submit (false = fill + screenshot only)
  max_per_day: 25    # hard cap on applications per day
  delay_seconds: [45, 180]      # random pause between applications
  answer_open_questions: true   # draft "Why do you want to work here?" etc. from your profile
  browser_channel: chrome
  headless: true

# Your mailbox: reads recruiter replies and sends outreach. For Gmail or NYU
# (Google) email: turn on 2-Step Verification, create an app password at
# myaccount.google.com/apppasswords, and set it as the NIGHTSHIFT_EMAIL_PASSWORD
# secret on your server. Never put the password in this file.
email:
  address: ""                  # e.g. bg2960@nyu.edu
  from_name: ""                # e.g. Rishik Gannavarapu
  imap_host: imap.gmail.com
  smtp_host: smtp.gmail.com
  check_replies: true
  check_every_minutes: 120

# Emails to recruiters (found with Hunter.io) and alumni you add in the app,
# at companies you've applied to. Set the HUNTER_API_KEY secret to find recruiters.
outreach:
  enabled: false
  auto_send: true              # false = drafts wait in the app until you tap Send
  max_per_day: 10
  max_per_company: 2
  follow_up_after_days: 6      # one follow-up, never after a reply
  hunter_monthly_credits: 50   # Hunter's free plan
  signature: ""                # e.g. "linkedin.com/in/you | github.com/you"
