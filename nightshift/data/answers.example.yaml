# Answers to application-form questions. `match` is a case-insensitive regex
# tested against each form field's label; `label` is how the app shows it. First match wins, and these win over the defaults
# taken from your profile (name, email, phone, LinkedIn, GitHub, school...).
#
# __FILL_ME__ means "never guess": any required question that lands on it
# sends the application to "Needs you" instead of being answered.

- label: Are you authorized to work in the country of the job?
  match: "authori[sz]ed to work|legally (eligible|permitted)|right to work"
  value: __FILL_ME__
- label: Will you need visa sponsorship?
  match: "sponsor"
  value: __FILL_ME__
- label: Salary expectation
  match: "salary|compensation expectation|expected pay"
  value: __FILL_ME__
- label: How did you hear about us?
  match: "how did you (hear|learn|find)|source"
  value: Company website
- label: Earliest start date
  match: "start date|when can you start|earliest"
  value: __FILL_ME__
- label: Willing to relocate?
  match: "relocat"
  value: __FILL_ME__
- label: Graduation date
  match: "graduat(ion|e) (date|year)|expected graduation"
  value: __FILL_ME__
- label: Website or portfolio
  match: "website|portfolio"
  value: __FILL_ME__
# Voluntary self-identification. Pick your own answers or keep declining.
- label: Gender / pronouns
  match: "gender|pronoun"
  value: Decline to self-identify
- label: Race / ethnicity
  match: "race|ethnic|hispanic|latino"
  value: Decline to self-identify
- label: Veteran status
  match: "veteran"
  value: I don't wish to answer
- label: Disability status
  match: "disabilit"
  value: I don't wish to answer
