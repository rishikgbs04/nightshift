# Bundled starter list of company job boards, used when
# companies.include_defaults: true in config.yaml.
#
# Slugs change when companies switch applicant-tracking systems, so some of
# these will be dead at any given time. Run `nightshift boards --prune` and
# dead ones are remembered in data/dead_boards.txt and skipped from then on.
# Pull requests that add or fix slugs are welcome.

